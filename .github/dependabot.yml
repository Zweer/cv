version: 2

updates:
  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    commit-message:
      prefix: "ci"
    labels:
      - github-actions
      - automated

  # Node dependencies for the CV tailoring engine (tools + tests).
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - Zweer
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
    labels:
      - dependencies
      - automated
    groups:
      # Group all patch and minor updates together.
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Node dev dependencies for the ported LinkedIn search portal CLI.
  - package-ecosystem: npm
    directory: /engine/portals/linkedin-search/cli
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - Zweer
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
    labels:
      - dependencies
      - automated
    groups:
      # Group all patch and minor updates together.
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
